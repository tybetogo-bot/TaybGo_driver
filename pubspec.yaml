name: teybatdriver
description: "TaybGo Driver - Driver partner application"
publish_to: 'none'
version: 1.0.10+11

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.2.0

  # State Management
  provider: ^6.1.2

  # Maps (OpenStreetMap)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # HTTP for API calls
  http: ^1.2.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  # Location
  geolocator: ^12.0.0

  # Storage
  shared_preferences: ^2.2.3

  # Image picking for documents
  image_picker: ^1.1.2
  file_picker: ^10.3.3

  # Direct DOM access for web file picker (bypasses file_picker web quirks)
  web: ^1.1.1

  # URL Launcher
  url_launcher: ^6.2.5

  # Firebase
  firebase_core: ^3.8.1
  firebase_crashlytics: ^4.3.10
  firebase_messaging: ^15.1.6

  # Local notifications (for foreground FCM display)
  flutter_local_notifications: ^18.0.1

  # Localization
  intl: ^0.20.2

  # Local packages
  phone_otp_auth_ui:
    path: packages/phone_otp_auth_ui

  # Tour
  tutorial_coach_mark: ^1.2.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/newlogo (2).jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/newlogo (2).jpg"
    background_color: "#ffffff"
    theme_color: "#4CAF50"
  windows:
    generate: false
  macos:
    generate: false

flutter:
  default-flavor: prod
  uses-material-design: true
  generate: true

  assets:
    - assets/signal.mp3
    - assets/images/
    - assets/icons/
    - assets/data/

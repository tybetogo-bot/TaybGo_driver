name: teybatdriver
description: "TypeToGo Driver - Driver partner application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.2.0

  # State Management
  provider: ^6.1.2

  # Maps (OpenStreetMap)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # HTTP for API calls
  http: ^1.2.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  # Location
  geolocator: ^12.0.0

  # Storage
  shared_preferences: ^2.2.3

  # Image picking for documents
  image_picker: ^1.1.2

  # URL Launcher
  url_launcher: ^6.2.5

  # Firebase
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # Localization
  intl: ^0.20.2
  country_code_picker_plus: ^0.1.0+1

  # Tour & Knowledge Base
  tutorial_coach_mark: ^1.2.11
  lottie: ^3.1.0
  flutter_svg: ^2.0.10
  expandable: ^5.0.1
  flutter_markdown: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/tybetogo.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/tybetogo.jpg"
    background_color: "#ffffff"
    theme_color: "#4CAF50"
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
